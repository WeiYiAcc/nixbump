name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux,   goarch: amd64 }
          - { goos: linux,   goarch: arm64 }
          - { goos: darwin,  goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Build
        run: go build -trimpath -ldflags "-s -w -X main.version=${{ github.ref_name }}" -o nixbump-${{ matrix.goos }}-${{ matrix.goarch }} .
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}


      - name: Pack tarball
        run: |
          mkdir -p dist
          mv nixbump-${{ matrix.goos }}-${{ matrix.goarch }} dist/nixbump
          tar czf nixbump-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz -C dist nixbump
          rm -rf dist
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: nixbump-${{ matrix.goos }}-${{ matrix.goarch }}
          path: nixbump-*

  release:
    name: attach to release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
